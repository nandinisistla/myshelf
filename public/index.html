<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyShelf</title>
  <meta name="description" content="Your skincare shelf, connecting the dots between your products, ingredients and skin." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="frame" class="frame">
    <main id="view" class="view" aria-live="polite"></main>

    <button id="badDayBtn" class="bad-day" type="button" aria-label="Log a bad skin day">
      <span class="bd-dot" aria-hidden="true"></span> Skin's acting up
    </button>

    <nav class="tabs" aria-label="Main">
      <a href="#shelf" data-tab="shelf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V9m4 11V5m4 15v-8m4 8V7"/></svg><span>Shelf</span></a>
      <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></a>
      <a href="#forme" data-tab="forme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="17" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="15" r="2"/><path d="M6.4 15.6 10.6 7.6M13.6 7.2l4.2 6.2M7 17.3l10-2"/></svg><span>For me</span></a>
      <a href="#chat" data-tab="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Ask AI</span></a>
    </nav>

    <div id="sheetRoot"></div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
