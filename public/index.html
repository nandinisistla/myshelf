<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyShelf</title>
  <meta name="description" content="Your skincare shelf, connecting the dots between your products, ingredients and skin." />
  <meta name="theme-color" content="#ecebe7" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="frame" class="frame">
    <header class="nav">
      <a href="#shelf" class="nav-mark" aria-label="MyShelf home">My<span>S</span><span class="h">h</span><span>elf</span></a>
      <nav class="nav-links" aria-label="Main">
        <a href="#shelf" data-tab="shelf">Shelf</a>
        <a href="#history" data-tab="history">History</a>
        <a href="#forme" data-tab="forme">For me</a>
        <a href="#chat" data-tab="chat">Ask AI</a>
      </nav>
      <div class="nav-actions">
        <button id="badDayBtn" class="btn bad-day" type="button" aria-label="Tell MyShelf your skin is having a rough day"><span class="bd-dot" aria-hidden="true"></span><span class="bd-text">Rough skin day?</span></button>
        <button id="profileBtn" class="icon-btn" type="button" aria-label="Skin profile and settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>
    <footer class="site-foot"><a href="#system">Components</a></footer>

    <div id="sheetRoot"></div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
